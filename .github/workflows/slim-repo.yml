name: slim-repo

# 一次性任务：把仓库精简为纯容器打包仓。
# 上游源码不参与构建（docker/Dockerfile 是 git fetch 上游 commit），
# 留着只会让仓库看着乱，这里一次性删掉。跑完即可删除本文件。
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/slim-repo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  slim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove upstream source tree
        run: |
          git rm -r --quiet --ignore-unmatch \
            cmd internal assets docs tools \
            go.mod go.sum announcements.json \
            .github/workflows/release.yml
          echo "===== files left ====="
          git ls-files

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "nothing to slim"
            exit 0
          fi
          git commit -m "chore: keep only container packaging files (upstream source is fetched at build time)"
          git push