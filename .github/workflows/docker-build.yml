name: build-zen-gate-image

# 触发时机：
#  - 推送到 master（改源码或打包文件都重建）
#  - 手动运行（Actions → 本工作流 → Run workflow）
#  - 每周一 03:00 自动重建一次，保证镜像始终跟得上上游（配合 fork 的 Sync fork）
on:
  push:
    branches: [master]
    paths-ignore: ['README.md']
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/zhangye151/zen-gate

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: derive version
        id: ver
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo latest)
          SHA=$(git rev-parse --short HEAD)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: login ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            ZEN_GATE_VERSION=${{ steps.ver.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.ver.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.ver.outputs.sha }}
